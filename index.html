    if (!btn) return;
    btn.textContent = THEME_ICON[nextTheme_(CURRENT_THEME)];
    btn.title = 'Тема: ' + THEME_NAME[CURRENT_THEME] + ' → ' + THEME_NAME[nextTheme_(CURRENT_THEME)];
  }
  function toggleTheme() {
    CURRENT_THEME = nextTheme_(CURRENT_THEME);
    document.documentElement.setAttribute('data-theme', CURRENT_THEME);
    try { localStorage.setItem('dmcrm_m_theme2', CURRENT_THEME); } catch (e) { console.error(e); }
    updateThemeBtn_();
    // тинты групп зашиты инлайном в разметку доски — перерисовать,
    // сохранив развёрнутые группы/этапы и скролл
    const state = captureBoardState();
    renderBoard();
    restoreBoardState(state);
  }
  // Светлый фон лейнов этапа под текущую тему (как themeTint_ десктопа):
  // Стекло/Осенняя — полупрозрачный (+'99'), Графит — тёмный вариант.
  function themeTint_(colorSet) {
    if (CURRENT_THEME === 'graphite') return colorSet.dark || colorSet.light;
    if (CURRENT_THEME === 'desert') return (colorSet.desert || colorSet.light) + '99';
    return colorSet.light + '99';
  }

  function plural_(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  // ---------- вкладки (mobile-v2.4) ----------
  const EDGE_SWIPE_PX = 24; // ширина зоны у левого края для жеста «назад» (iPhone)
  const VIEW_IDS = ['boardView', 'purchaseView', 'bonusView', 'debtsView'];
  const VIEW_BY_TAB = { board: 'boardView', purchase: 'purchaseView', bonus: 'bonusView', debts: 'debtsView' };
  let currentTab = 'board';
  // fromPopstate — переключение пришло из «назад» (историю не трогаем).
  function switchTab(tab, fromPopstate) {
    if (detailOpen) closeDetail(true); // запись карточки в истории остаётся — «назад» её просто пропустит
    if (tab === currentTab) {
      // повторное нажатие на «Сделки» внутри группы — назад к группам
      if (tab === 'board' && boardGroup) closeGroup_(); else window.scrollTo(0, 0);
      return;
    }
    currentTab = tab;
    VIEW_IDS.forEach(function (id) { document.getElementById(id).hidden = id !== VIEW_BY_TAB[tab]; });
    document.querySelectorAll('#tabbar .m-tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
    window.scrollTo(0, 0);
    if (REG[tab]) loadRegistry_(tab, true);
    if (!fromPopstate) navPush_({});
  }

  // ---------- «назад» как в браузере (mobile-v2.19) ----------
  // Каждый экран (вкладка, открытая группа, карточка сделки) — запись в
  // history; «назад» телефона (Android) и свайп от левого края (iPhone,
  // установленное приложение) возвращают на предыдущий экран. В Apps Script
  // историю не трогаем — страница там в iframe песочницы.
  function navSnapshot_(extra) {
    return Object.assign({ dmNav: 1, tab: currentTab, group: boardGroup }, extra || {});
  }
  function navPush_(extra) {
    if (IS_APPS_SCRIPT) return;
    try { history.pushState(navSnapshot_(extra), ''); } catch (e) { console.error(e); }
  }
  function onNavPop_(e) {
    const st = (e && e.state && e.state.dmNav) ? e.state : { tab: 'board', group: null };
    if (detailOpen) closeDetail(true);
    const tab = st.tab || 'board';
    if (tab !== currentTab) switchTab(tab, true);
    const g = st.group || null;
    if (tab === 'board' && g !== boardGroup) {
      boardGroup = g;
      renderBoard();
      if (g) centerStageChip_();
      window.scrollTo(0, 0);
    }
  }
  function isNavRoot_() { return !detailOpen && !boardGroup && currentTab === 'board'; }

  // ---------- реестры «Закупка» и «Бонусы» (mobile-v2.4) ----------
  // Как доска: сразу из сохранённого на телефоне, свежие — с сервера.
  // ls — ключ сохранения на телефоне; у «Бонусов»/«Остатков» null: под
  // паролем данные живут только в памяти, на телефоне не остаются (v2.12).
  const REG = {
    purchase: { action: 'getPurchaseRegistry', ls: 'dmcrm_m_purchase_cache', rows: null, filter: 'unpaid', q: '', loading: false },
    bonus: { action: 'getBonusRegistry', ls: null, gated: true, rows: null, tab: 'deals', status: 'due', stage: null, q: '', loading: false },
    debts: { action: 'getDebtsRegistry', ls: null, gated: true, rows: null, filter: 'owe', q: '', stage: null, loading: false }
  };
  try { localStorage.removeItem('dmcrm_m_bonus_cache'); } catch (e) { console.error(e); } // до v2.12 бонусы сохранялись без пароля
  function loadRegistry_(kind, showBusy) {
    const r = REG[kind];
    if (r.gated && GATE_ON && !gateToken_()) { showGateLock_(kind, ''); return; }
    if (r.gated) hideGateLock_(kind);
    if (!r.rows && r.ls) {
      try { const c = JSON.parse(localStorage.getItem(r.ls) || 'null'); if (c && Array.isArray(c.rows)) r.rows = c.rows; } catch (e) { console.error(e); }
      if (r.rows) renderRegistry_(kind);
    }
    if (r.loading) return;
    r.loading = true;
    if (showBusy) setBusy_(true);
    api(r.action, r.gated ? { token: gateToken_() } : null).then(function (rows) {
      r.rows = rows || [];
      if (r.ls) { try { localStorage.setItem(r.ls, JSON.stringify({ t: Date.now(), rows: r.rows })); } catch (e) { console.error(e); } }
      setOffline_(false);
      renderRegistry_(kind);
    }).catch(function (err) {
      console.error('loadRegistry_ ' + kind + ':', err);
      const msg = String(err && err.message ? err.message : err);
      if (r.gated && msg.indexOf(GATE_NEED_PASSWORD) !== -1) {
        // ключ истёк (6 ч) или сервер перезапущен — спросить пароль заново
        setGateToken_('');
        GATED_KINDS.forEach(function (k) { REG[k].rows = null; });
        renderTabBadges_();
        showGateLock_(kind, 'Сессия истекла — введите пароль ещё раз');
        return;
      }
      if (r.rows) setOffline_(true);
      else document.getElementById(kind + 'Body').innerHTML = '<div class="state-msg">Не удалось загрузить.<br>' + esc(msg) + '</div>';
    }).then(function () {
      r.loading = false;
      if (showBusy) setBusy_(false);
    });
  }

  // ---------- пароль на «Бонусы» и «Остатки» (mobile-v2.12) ----------
  // Тот же пароль, что на десктопе. Проверяет сервер (unlockGate) и выдаёт
  // временный ключ; ключ живёт в sessionStorage — до закрытия приложения.
  const GATED_KINDS = ['bonus', 'debts'];
  // v2.21: пароль «пока» выключен по просьбе пользователя. Включить — true
  // здесь и GATE_ENABLED = true в Code.gs (сервер проверяет сам).
  const GATE_ON = false;
  const GATE_SS = 'dmcrm_m_gate';
  const GATE_NEED_PASSWORD = 'NEED_PASSWORD';
  function gateToken_() {
    try { return sessionStorage.getItem(GATE_SS) || ''; } catch (e) { console.error(e); return ''; }
  }
  function setGateToken_(t) {
    try { if (t) sessionStorage.setItem(GATE_SS, t); else sessionStorage.removeItem(GATE_SS); } catch (e) { console.error(e); }
  }
  function showGateLock_(kind, msg) {
    document.getElementById(kind + 'Content').hidden = true;
    document.getElementById(kind + 'Sub').textContent = 'Закрыто паролем';
    const lock = document.getElementById(kind + 'Lock');
    lock.hidden = false;
    lock.innerHTML =
      '<div class="m-pwa-setup-title">Раздел закрыт паролем</div>' +
      '<div class="m-pwa-setup-hint">Тот же пароль, что на компьютере для «Бонусов» и «Остатков». Спрашивается один раз — до закрытия приложения.</div>' +
      '<input type="password" id="' + kind + 'Pw" autocomplete="current-password" placeholder="Пароль" onkeydown="if (event.key === \'Enter\') submitGate_(\'' + kind + '\')">' +
      '<div class="m-pwa-setup-err" id="' + kind + 'PwErr">' + esc(msg || '') + '</div>' +
      '<button type="button" class="m-pwa-btn" onclick="submitGate_(\'' + kind + '\')">Открыть</button>';
  }
  function hideGateLock_(kind) {
    document.getElementById(kind + 'Lock').hidden = true;
    document.getElementById(kind + 'Content').hidden = false;
  }
  function submitGate_(kind) {
    const input = document.getElementById(kind + 'Pw');
    const err = document.getElementById(kind + 'PwErr');
    const pw = input.value;
    if (!pw) { err.textContent = 'Введите пароль'; return; }
    err.textContent = 'Проверяю…';
    setBusy_(true);
    api('unlockGate', { pw: pw }).then(function (token) {
      setGateToken_(token);
      GATED_KINDS.forEach(function (k) { loadRegistry_(k, k === kind); });
      if (REG.bonus.tab === 'designers') loadDesigners_();
    }).catch(function (e) {
      console.error('submitGate_:', e);
      err.textContent = String(e && e.message ? e.message : e);
      input.select();
    }).then(function () { setBusy_(false); });
  }
  function setRegFilter_(kind, v) {
    REG[kind].filter = v;
    document.querySelectorAll('#' + kind + 'Seg button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
    renderRegistry_(kind);
  }
  function setRegSearch_(kind, v) {
    REG[kind].q = String(v || '').trim().toLowerCase();
    renderRegistry_(kind);
  }
  function regMatches_(q, fields) {
    if (!q) return true;
    return fields.some(function (f) { return String(f || '').toLowerCase().indexOf(q) !== -1; });
  }
  function isPurchaseDue_(p) { return p.amount > 0 && p.remainder > 0; }
  function isBonusDue_(b) { return !b.noBonus && b.remainder > 0; }
  function isDebtDue_(d) { return debtRow_(d).due > 0; }
  function renderRegistry_(kind) {
    if (kind === 'purchase') renderPurchase_(); else if (kind === 'bonus') renderBonus_(); else renderDebts_();
    renderTabBadges_();
  }
  function renderTabBadges_() {
    [['purchase', isPurchaseDue_], ['bonus', isBonusDue_], ['debts', isDebtDue_]].forEach(function (pair) {
      const rows = REG[pair[0]].rows;
      const badge = document.getElementById(pair[0] + 'Badge');
      const n = rows ? rows.filter(pair[1]).length : 0;
      badge.textContent = n > 99 ? '99+' : String(n);
      badge.hidden = !n;
    });
  }
  function kpi_(label, value, accent) {
    return '<div class="m-section"><div class="m-kpi-lbl">' + esc(label) + '</div><div class="m-kpi-num' + (accent ? ' accent' : '') + '">' + esc(value) + '</div></div>';
  }

  // ---------- «Остатки» (mobile-v2.12) — как окно десктопа v4.42 ----------
  // «По графику должны» — схема оплаты 70/20/10: до цеха 70%, цех/монтаж 90%,
  // «Закрыть»/«Реализовано» — 100%.
  const DEBT_SHARE_BY_STAGE = { 'Успешные': .7, 'Замер': .7, 'Чертежи': .7, 'Закупка': .7, 'Цех': .9, 'Монтаж': .9, 'Закрыть': 1, 'Реализовано': 1 };
  function debtRow_(d) {
    const share = DEBT_SHARE_BY_STAGE[d.stage] != null ? DEBT_SHARE_BY_STAGE[d.stage] : .7;
    return Object.assign({}, d, {
      share: share,
      pct: d.sum ? Math.max(0, Math.min(1, d.paid / d.sum)) : 0,
      due: Math.max(0, Math.round(d.sum * share - d.paid))
    });
  }
  function debtStageToggle_(i) {
    const st = STAGES[i] || 'Успешные';
    REG.debts.stage = REG.debts.stage === st ? null : st;
    renderDebts_();
  }
  function renderDebts_() {
    const r = REG.debts;
    if (!r.rows) return;
    const all = r.rows.map(debtRow_);
    const matched = all.filter(function (d) { return regMatches_(r.q, [d.contractNo, d.name, d.stage]); });
    const totalRem = matched.reduce(function (s, d) { return s + Math.max(0, d.remainder); }, 0);
    const totalDue = matched.reduce(function (s, d) { return s + d.due; }, 0);
    document.getElementById('debtsKpis').innerHTML =
      kpi_('Всего должны', fmtMoney(totalRem)) + kpi_('По графику уже', fmtMoney(totalDue), true);
    const oweCount = all.filter(function (d) { return d.remainder > 0; }).length;
    const dueCount = all.filter(function (d) { return d.due > 0; }).length;
    document.getElementById('debtsSub').textContent = oweCount
      ? 'Должны: ' + oweCount + ' ' + plural_(oweCount, 'сделка', 'сделки', 'сделок') + (dueCount ? ' · пора напомнить: ' + dueCount : '')
      : 'Все оплатили';

    // остатки по этапам — в порядке воронки; нажатие — фильтр по этапу
    const byStage = {};
    matched.forEach(function (d) { if (d.remainder > 0) { const b = byStage[d.stage] || (byStage[d.stage] = { n: 0, sum: 0 }); b.n++; b.sum += d.remainder; } });
    const order = function (st) { const i = STAGES.indexOf(st); return i === -1 ? 2.5 : i; }; // «Успешные» — между Договором и Замером
    document.getElementById('debtsStages').innerHTML = Object.keys(byStage).sort(function (a, b) { return order(a) - order(b); }).map(function (st) {
      return '<button type="button" class="m-dstage' + (r.stage === st ? ' on' : '') + '" onclick="debtStageToggle_(' + STAGES.indexOf(st) + ')">' +
        '<span class="ds-name">' + esc(st) + ' · ' + byStage[st].n + '</span><span class="ds-sum">' + esc(fmtMoney(byStage[st].sum)) + '</span></button>';
    }).join('');

    const list = matched.filter(function (d) { return (r.filter === 'all' || d.remainder > 0) && (!r.stage || d.stage === r.stage); })
      .sort(function (a, b) { return (b.due - a.due) || (b.remainder - a.remainder); });
    document.getElementById('debtsBody').innerHTML = list.length ? list.map(function (d) {
      const chips = (d.remainder > 0 ? '<span class="m-chip">остаток ' + esc(fmtMoney(d.remainder)) + '</span>' : '<span class="m-chip ok">оплачено полностью</span>') +
        (d.due > 0 ? '<span class="m-chip due">по графику должны ' + esc(fmtMoney(d.due)) + '</span>' : '');
      return '<div class="m-section m-reg-item" onclick="openDetail(\'' + esc(d.dealId) + '\')">' +
        '<div class="m-reg-top"><span class="m-reg-name">' + esc(d.name || '—') + '</span><span class="m-reg-amount">' + esc(fmtMoney(d.sum)) + '</span></div>' +
        '<div class="m-reg-meta">' + esc([d.contractNo, d.stage].filter(Boolean).join(' · ')) + '</div>' +
        '<div class="m-debt-bar" title="по графику ' + Math.round(d.share * 100) + '%"><div class="m-debt-fill" style="width:' + (d.pct * 100).toFixed(1) + '%"></div>' +
        '<span class="m-debt-mark" style="left:' + (d.share * 100) + '%"></span></div>' +
        '<div class="m-reg-meta">оплачено ' + esc(fmtMoney(d.paid)) + ' · ' + Math.round(d.pct * 100) + '%' + (d.lastPayDate ? ' · последний платёж ' + esc(d.lastPayDate) : '') + '</div>' +
        '<div class="m-reg-bottom">' + chips + '</div>' +
        '</div>';
    }).join('') : '<div class="state-msg">' + (r.q || r.stage ? 'Ничего не найдено' : (r.filter === 'owe' ? 'Долгов нет 🎉' : 'Подписанных сделок с суммой нет')) + '</div>';
  }

  function renderPurchase_() {
    const r = REG.purchase;
    if (!r.rows) return;
    const matched = r.rows.filter(function (p) {
      return regMatches_(r.q, [p.name, p.supplierName, p.invoiceNo, p.dealName, p.contractNo]);
    });
    const withSum = matched.filter(function (p) { return p.amount > 0; });
    const total = withSum.reduce(function (s, p) { return s + p.amount; }, 0);
    const paid = withSum.reduce(function (s, p) { return s + p.paid; }, 0);
    const due = withSum.filter(isPurchaseDue_).reduce(function (s, p) { return s + p.remainder; }, 0);
    document.getElementById('purchaseKpis').innerHTML =
      kpi_('Заказано', fmtMoney(total)) + kpi_('Оплачено', fmtMoney(paid)) + kpi_('Остаток', fmtMoney(due), true);
    const dueCount = r.rows.filter(isPurchaseDue_).length;
    document.getElementById('purchaseSub').textContent = dueCount
      ? 'Не оплачено: ' + dueCount + ' ' + plural_(dueCount, 'счёт', 'счёта', 'счетов')
      : 'Все счета оплачены';

    let list = r.filter === 'unpaid' ? matched.filter(isPurchaseDue_) : matched.slice();
    list.sort(r.filter === 'unpaid'
      ? function (a, b) { return b.remainder - a.remainder; }
      : function (a, b) { return String(a.dealName).localeCompare(String(b.dealName), 'ru') || String(a.name).localeCompare(String(b.name), 'ru'); });
    document.getElementById('purchaseBody').innerHTML = list.length ? list.map(function (p) {
      const cat = PURCHASE_CATEGORIES.find(function (c) { return c.key === p.category; });
      const st = PURCHASE_STAGES.find(function (x) { return x.key === p.status; });
      const meta = [p.supplierName, p.invoiceNo ? 'счёт № ' + p.invoiceNo : ''].filter(Boolean).join(' · ');
      const payChip = !p.amount ? '<span class="m-chip off">без суммы</span>'
        : (p.remainder > 0
          ? '<span class="m-chip due">остаток ' + esc(fmtMoney(p.remainder)) + '</span>'
          : '<span class="m-chip ok">оплачено' + (p.lastPayDate ? ' ' + esc(p.lastPayDate) : '') + '</span>');
      return '<div class="m-section m-reg-item" onclick="openDetail(\'' + esc(p.dealId) + '\')">' +
        '<div class="m-reg-top"><span class="m-reg-name">' + esc(p.name || '—') + '</span><span class="m-reg-amount">' + (p.amount ? esc(fmtMoney(p.amount)) : '') + '</span></div>' +
        (meta ? '<div class="m-reg-meta">' + esc(meta) + '</div>' : '') +
        '<div class="m-reg-deal">' + esc(p.dealName || 'Сделка не найдена') + (p.contractNo ? ' · ' + esc(p.contractNo) : '') + '</div>' +
        '<div class="m-reg-bottom"><span class="m-cat ' + esc(p.category) + '">' + esc(cat ? cat.label : p.category) + '</span>' +
        '<span class="m-chip">' + esc(st ? st.label : (p.status || 'Корзина')) + '</span>' + payChip + '</div>' +
        '</div>';
    }).join('') : '<div class="state-msg">' + (r.q ? 'Ничего не найдено' : (r.filter === 'unpaid' ? 'Неоплаченных счетов нет 🎉' : 'Позиций закупки нет')) + '</div>';
  }

  // ---------- «Бонусы» (mobile-v2.14) — как окно десктопа v4.51 ----------
  // Статусы строки — как BONUS_STATUS десктопа. Плитки сводки нажимаются —
  // фильтр по статусу; кнопки этапов — долг по этапам, фильтр по этапу.
  const BONUS_STATUS = { due: 'к выплате', unset: 'бонус не указан', undated: '⚠ без даты', paid: 'выплачено', none: 'нет бонуса' };
  const BONUS_STATUS_ORDER = { due: 0, unset: 1, undated: 2, paid: 3, none: 4 };
  function bonusRowStatus_(b) {
    if (b.noBonus) return 'none';
    if (!b.bonus && !b.paid) return 'unset';
    if (b.remainder > 0) return 'due';
    if (b.undatedPaid > 0) return 'undated';
    return 'paid';
  }
  let BONUS_DSGN = null; // сводка «По дизайнерам» (getDesignerSummary), только в памяти
  function setBonusTab_(tab) {
    REG.bonus.tab = tab;
    document.querySelectorAll('#bonusSeg button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === tab); });
    if (tab === 'designers') loadDesigners_();
    renderBonus_();
  }
  function setBonusStatus_(st) {
    REG.bonus.status = REG.bonus.status === st ? null : st;
    renderBonus_();
  }
  function bonusStageToggle_(i) {
    const st = STAGES[i] || 'Успешные';
    REG.bonus.stage = REG.bonus.stage === st ? null : st;
    renderBonus_();
  }
  // Нажали на дизайнера — его сделки во вкладке «По сделкам».
  function bonusDesignerDeals_(name) {
    REG.bonus.status = null;
    REG.bonus.stage = null;
    document.getElementById('bonusSearch').value = name;
    REG.bonus.q = String(name).toLowerCase();
    setBonusTab_('deals');
    window.scrollTo(0, 0);
  }
  function loadDesigners_() {
    if (GATE_ON && !gateToken_()) return;
    api('getDesignerSummary', { token: gateToken_() }).then(function (rows) {
      BONUS_DSGN = rows || [];
      if (REG.bonus.tab === 'designers') renderBonus_();
    }).catch(function (err) {
      console.error('loadDesigners_:', err);
      const msg = String(err && err.message ? err.message : err);
      if (msg.indexOf(GATE_NEED_PASSWORD) !== -1) {
        setGateToken_('');
        GATED_KINDS.forEach(function (k) { REG[k].rows = null; });
        BONUS_DSGN = null;
        renderTabBadges_();
        showGateLock_('bonus', 'Сессия истекла — введите пароль ещё раз');
      } else if (REG.bonus.tab === 'designers' && !BONUS_DSGN) {
        document.getElementById('bonusBody').innerHTML = '<div class="state-msg">Не удалось загрузить.<br>' + esc(msg) + '</div>';
      }
    });
  }
  function tile_(label, value, sub, opts) {
    opts = opts || {};
    return '<div class="m-section' + (opts.onclick ? ' m-kpi-tap' : '') + (opts.on ? ' on' : '') + '"' + (opts.onclick ? ' onclick="' + opts.onclick + '"' : '') + '>' +
      '<div class="m-kpi-lbl">' + esc(label) + '</div><div class="m-kpi-num' + (opts.accent ? ' accent' : '') + '">' + esc(value) + '</div>' +
      (sub ? '<div class="m-kpi-sub">' + esc(sub) + '</div>' : '') + '</div>';
  }
  function renderBonus_() {
    const r = REG.bonus;
    if (!r.rows) return;
    const all = r.rows;
    let debt = 0, debtN = 0, unset = 0, undated = 0;
    all.forEach(function (b) {
      const st = bonusRowStatus_(b);
      if (st === 'due') { debt += b.remainder; debtN++; }
      if (st === 'unset') unset++;
      if (st === 'undated') undated++;
    });
    document.getElementById('bonusSub').textContent = debtN
      ? 'Долг дизайнерам: ' + fmtMoney(debt) + ' · ' + debtN + ' ' + plural_(debtN, 'сделка', 'сделки', 'сделок')
      : 'Всё выплачено';
    const kpis = document.getElementById('bonusKpis');
    const stagesEl = document.getElementById('bonusStages');
    const body = document.getElementById('bonusBody');

    if (r.tab === 'designers') {
      stagesEl.innerHTML = '';
      if (!BONUS_DSGN) { kpis.innerHTML = ''; body.innerHTML = '<div class="state-msg">Загрузка…</div>'; return; }
      const list = BONUS_DSGN.filter(function (d) { return regMatches_(r.q, [d.name, d.phone, d.email]); });
      const dsgDebt = list.reduce(function (s, d) { return s + d.debt; }, 0);
      const withDebt = list.filter(function (d) { return d.debt > 0; }).length;
      kpis.innerHTML = tile_('Долг всего', fmtMoney(dsgDebt), withDebt + ' ' + plural_(withDebt, 'дизайнер', 'дизайнера', 'дизайнеров') + ' с долгом', { accent: true }) +
        tile_('Дизайнеров', String(list.length), 'в справочнике');
      list.sort(function (a, b) { return (b.debt - a.debt) || (b.deals - a.deals) || String(a.name).localeCompare(String(b.name), 'ru'); });
      body.innerHTML = list.length ? list.map(function (d) {
        const contacts = [d.phone ? '<a class="m-tel" href="tel:' + esc(String(d.phone).replace(/[^\d+]/g, '')) + '" onclick="event.stopPropagation()">' + esc(d.phone) + '</a>' : '',
          d.email ? esc(d.email) : ''].filter(Boolean).join(' · ');
        const stats = [d.deals + ' ' + plural_(d.deals, 'сделка', 'сделки', 'сделок'), d.bonus ? 'бонусов ' + fmtMoney(d.bonus) : '', d.paid ? 'выплачено ' + fmtMoney(d.paid) : ''].filter(Boolean).join(' · ');
        const chips = (d.debt > 0 ? '<span class="m-chip due">долг ' + esc(fmtMoney(d.debt)) + '</span>' : (d.deals ? '<span class="m-chip ok">долгов нет</span>' : '')) +
          (d.unset ? '<span class="m-chip off">не указан: ' + d.unset + '</span>' : '') +
          (d.lastPayDate ? '<span class="m-chip">последняя ' + esc(d.lastPayDate) + '</span>' : '');
        return '<div class="m-section m-reg-item" onclick="bonusDesignerDeals_(\'' + esc(String(d.name).replace(/'/g, '')) + '\')">' +
          '<div class="m-reg-top"><span class="m-reg-name">' + esc(d.name || '—') + '</span><span class="m-reg-amount">' + (d.debt > 0 ? esc(fmtMoney(d.debt)) : '') + '</span></div>' +
          (contacts ? '<div class="m-reg-meta">' + contacts + '</div>' : '') +
          '<div class="m-reg-meta">' + esc(stats) + '</div>' +
          (chips ? '<div class="m-reg-bottom">' + chips + '</div>' : '') +
          '</div>';
      }).join('') : '<div class="state-msg">' + (r.q ? 'Ничего не найдено' : 'Дизайнеров пока нет') + '</div>';
      return;
    }

    // «По сделкам»: плитки сводки (по ВСЕМ строкам, как на десктопе), нажатие — фильтр
    kpis.innerHTML =
      tile_('Долг дизайнерам', fmtMoney(debt), debtN + ' ' + plural_(debtN, 'сделка', 'сделки', 'сделок') + ' к выплате', { accent: true, onclick: "setBonusStatus_('due')", on: r.status === 'due' }) +
      tile_('Бонус не указан', String(unset), 'проставить на компьютере', { onclick: "setBonusStatus_('unset')", on: r.status === 'unset' }) +
      (undated ? tile_('⚠ Без даты', String(undated), 'перепроверить', { onclick: "setBonusStatus_('undated')", on: r.status === 'undated' }) : '');
    // долг по этапам — в порядке воронки
    const byStage = {};
    all.forEach(function (b) { if (bonusRowStatus_(b) === 'due') { const x = byStage[b.dealStage] || (byStage[b.dealStage] = { n: 0, sum: 0 }); x.n++; x.sum += b.remainder; } });
    const order = function (st) { const i = STAGES.indexOf(st); return i === -1 ? 2.5 : i; };
    stagesEl.innerHTML = Object.keys(byStage).sort(function (a, b) { return order(a) - order(b); }).map(function (st) {
      return '<button type="button" class="m-dstage' + (r.stage === st ? ' on' : '') + '" onclick="bonusStageToggle_(' + STAGES.indexOf(st) + ')">' +
        '<span class="ds-name">' + esc(st) + ' · ' + byStage[st].n + '</span><span class="ds-sum">' + esc(fmtMoney(byStage[st].sum)) + '</span></button>';
    }).join('');

    const list = all.filter(function (b) {
      return regMatches_(r.q, [b.designer, b.dealName, b.contractNo]) &&
        (!r.status || bonusRowStatus_(b) === r.status) && (!r.stage || b.dealStage === r.stage);
    }).sort(function (a, b) {
      return (BONUS_STATUS_ORDER[bonusRowStatus_(a)] - BONUS_STATUS_ORDER[bonusRowStatus_(b)]) || (b.remainder - a.remainder) ||
        String(a.designer || '').localeCompare(String(b.designer || ''), 'ru');
    });
    body.innerHTML = list.length ? list.map(function (b) {
      const st = bonusRowStatus_(b);
      const chip = st === 'due' ? '<span class="m-chip due">к выплате ' + esc(fmtMoney(b.remainder)) + '</span>'
        : st === 'undated' ? '<span class="m-chip due">⚠ без даты ' + esc(fmtMoney(b.undatedPaid)) + '</span>'
        : st === 'paid' ? '<span class="m-chip ok">выплачено</span>'
        : '<span class="m-chip off">' + BONUS_STATUS[st] + '</span>';
      const pay = [b.paid ? 'выплачено ' + fmtMoney(b.paid) : '', b.lastPayDate ? 'последняя ' + b.lastPayDate : ''].filter(Boolean).join(' · ');
      return '<div class="m-section m-reg-item" onclick="openDetail(\'' + esc(b.dealId) + '\')">' +
        '<div class="m-reg-top"><span class="m-reg-name">' + esc(b.dealName || '—') + '</span><span class="m-reg-amount">' + (b.bonus ? esc(fmtMoney(b.bonus)) : '') + '</span></div>' +
        '<div class="m-reg-meta">' + esc([b.designer || 'дизайнер не указан', b.dealStage, b.contractNo].filter(Boolean).join(' · ')) + '</div>' +
        (pay ? '<div class="m-reg-meta">' + esc(pay) + '</div>' : '') +
        '<div class="m-reg-bottom">' + chip + '</div>' +
        '</div>';
    }).join('') : '<div class="state-msg">' + (r.q || r.status || r.stage ? 'Ничего не найдено' : 'Бонусов нет') + '</div>';
  }

  function groupForStage(stage) {
    return STAGE_GROUPS.find(function (g) { return g.stages.indexOf(stage) !== -1; });
  }

  function initMarquee() {
    const el = document.getElementById('marquee-mobile');
    el.textContent = MARQUEE_PHRASES[Math.floor(Math.random() * MARQUEE_PHRASES.length)];
  }

  function showLoadError(err) {
    document.getElementById('boardBody').innerHTML =
      '<div class="state-msg">Не удалось загрузить данные.<br>' + esc(err && err.message ? err.message : err) +
      (IS_APPS_SCRIPT ? '' : '<br><br><button type="button" class="m-pwa-btn" onclick="loadBoard()">Повторить</button>' +
        ' <button type="button" class="m-pwa-btn secondary" onclick="showPwaSetup_()">Сменить ссылку</button>') +
      '</div>';
  }

  // ---------- транспорт: Apps Script или PWA (mobile-v2.2) ----------
  // Один и тот же Index.html работает в двух местах:
  //  - внутри Apps Script (HtmlService) — через google.script.run;
  //  - как PWA на GitHub Pages (pwa/index.html собирается из этого файла
  //    скриптом build-pwa.js) — через fetch к JSON API того же веб-аппа
  //    (?action=getBoard|getDealDetail, см. apiDispatch_ в Code.gs).
  // Ссылка /exec в PWA НЕ зашита в код (сайт на Pages публичный, а ссылка —
  // ключ к данным): вводится один раз на телефоне или приходит в ссылке
  // вида .../#exec=<ссылка>, хранится в localStorage.
  const IS_APPS_SCRIPT = !!(window.google && google.script && google.script.run);
  const API_URL_KEY = 'dmcrm_m_api_url';
  const API_TIMEOUT_MS = 30000;
  function getApiUrl_() {
    try { return localStorage.getItem(API_URL_KEY) || ''; } catch (e) { console.error(e); return ''; }
  }
  function isValidExecUrl_(u) {
    return /^https:\/\/script\.google\.com\/.+\/exec$/.test(String(u || '').trim());
  }
  function api(action, params) {
    if (IS_APPS_SCRIPT) {
      return new Promise(function (resolve, reject) {
        const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        if (action === 'getDealDetail') runner.getDealDetail(params.id);
        else if (action === 'unlockGate') runner.unlockGate(params.pw);
        else if (['getBonusRegistry', 'getDebtsRegistry', 'getDesignerSummary'].indexOf(action) !== -1) runner[action](params.token);
        else if (['getBoard', 'getPurchaseRegistry', 'getAllDealDetails'].indexOf(action) !== -1) runner[action]();
        else reject(new Error('Неизвестное действие: ' + action));
      });
    }
    // Не ждать вечно: через API_TIMEOUT_MS — понятная ошибка с «Повторить».
    const ctrl = window.AbortController ? new AbortController() : null;
    const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, API_TIMEOUT_MS) : null;
    const opts = ctrl ? { signal: ctrl.signal } : {};
    // Пароль — только POST-ом (в адрес запроса не кладём), остальное — GET.
    const req = action === 'unlockGate'
      ? fetch(getApiUrl_(), Object.assign({ method: 'POST', body: JSON.stringify({ action: action, pw: params.pw }) }, opts))
      : fetch(getApiUrl_() + '?' + new URLSearchParams(Object.assign({ action: action }, params || {})).toString(), opts);
    return req
      .catch(function (err) {
        if (err && err.name === 'AbortError') throw new Error('Сервер не ответил за ' + (API_TIMEOUT_MS / 1000) + ' секунд');
        throw err;
      })
      .then(function (res) {
        clearTimeout(timer);
        if (!res.ok) throw new Error('Сервер ответил ' + res.status);
        return res.json();
      })
      .then(function (json) {
        if (!json || !json.ok) throw new Error((json && json.error) || 'Сервер вернул ошибку');
        return json.data;
      });
  }
  // Ссылка из адреса (#exec=...) — сохранить и убрать из адресной строки.
  (function takeExecFromHash_() {
    if (IS_APPS_SCRIPT) return;
    const m = location.hash.match(/[#&]exec=([^&]+)/);
    if (!m) return;
    const u = decodeURIComponent(m[1]);
    if (isValidExecUrl_(u)) {
      try { localStorage.setItem(API_URL_KEY, u); } catch (e) { console.error(e); }
    }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { console.error(e); }
  })();
  function showPwaSetup_() {
    document.getElementById('boardDash').hidden = true;
    document.getElementById('tabbar').hidden = true;
    document.getElementById('summaryBar').textContent = 'Нужна ссылка на веб-приложение';
    document.getElementById('boardBody').innerHTML =
      '<div class="m-pwa-setup">' +
      '<div class="m-pwa-setup-title">Подключение к CRM</div>' +
      '<div class="m-pwa-setup-hint">Вставьте ссылку мобильного веб-приложения Apps Script — она заканчивается на <b>/exec</b>. Вводится один раз, хранится только на этом телефоне.</div>' +
      '<input type="url" id="pwaExecInput" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(getApiUrl_()) + '">' +
      '<div class="m-pwa-setup-err" id="pwaExecErr"></div>' +
      '<button type="button" class="m-pwa-btn" onclick="savePwaSetup_()">Подключить</button>' +
      '</div>';
  }
  function savePwaSetup_() {
    const u = document.getElementById('pwaExecInput').value.trim();
    if (!isValidExecUrl_(u)) {
      document.getElementById('pwaExecErr').textContent = 'Это не похоже на ссылку веб-приложения: нужна https://script.google.com/…/exec';
      return;
    }
    try { localStorage.setItem(API_URL_KEY, u); } catch (e) { console.error(e); }
    document.getElementById('boardBody').innerHTML = '<div class="state-msg">Загрузка сделок…</div>';
    loadBoard();
  }
  // Пометка «нет связи» в строке сводки (SW в это время отдаёт последний
  // сохранённый ответ, если он есть).
  function setOffline_(off) {
    document.body.classList.toggle('m-offline', !!off);
  }

  // ---------- быстрый старт (mobile-v2.3) ----------
  // Последняя полученная доска хранится на телефоне: при запуске показываем
  // её сразу, а свежую подтягиваем в фоне (полоска под шапкой + «обновляю…»).
  // Холодный старт Apps Script — несколько секунд, смотреть на пустой экран
  // всё это время не нужно.
  const BOARD_CACHE_LS = 'dmcrm_m_board_cache';
  function readBoardCache_() {
    try {
      const raw = localStorage.getItem(BOARD_CACHE_LS);
      const c = raw ? JSON.parse(raw) : null;
      return c && Array.isArray(c.deals) ? c : null;
    } catch (e) { console.error(e); return null; }
  }
  function saveBoardCache_(deals) {
    try { localStorage.setItem(BOARD_CACHE_LS, JSON.stringify({ t: Date.now(), deals: deals })); } catch (e) { console.error(e); }
  }
  let busyCount = 0;
  function setBusy_(on) {
    busyCount = Math.max(0, busyCount + (on ? 1 : -1));
    document.body.classList.toggle('m-busy', busyCount > 0);
  }
  // Новая доска пришла: сохранить и перерисовать (если изменилась),
  // не сворачивая открытые группы и не сбрасывая скролл.
  function applyFreshBoard_(deals) {
    saveBoardCache_(deals);
    setOffline_(false);
    prefetchDetails_();
    const snapshot = JSON.stringify(deals);
    if (snapshot === lastBoardSnapshot) return;
    lastBoardSnapshot = snapshot;
    ALL_DEALS = deals;
    const hadBoard = !!document.querySelector('.m-group');
    const state = hadBoard ? captureBoardState() : null;
    document.getElementById('boardDash').hidden = false;
    document.getElementById('tabbar').hidden = false;
    renderBoard();
    if (state) restoreBoardState(state);
  }

  function loadBoard() {
    if (!IS_APPS_SCRIPT && !getApiUrl_()) { showPwaSetup_(); return; }
    const cached = readBoardCache_();
    let slowHint = null;
    if (cached && !document.querySelector('.m-group')) {
      ALL_DEALS = cached.deals;
      lastBoardSnapshot = JSON.stringify(cached.deals);
      document.getElementById('boardDash').hidden = false;
      renderBoard();
    } else if (!cached) {
      document.getElementById('boardBody').innerHTML = '<div class="state-msg">Загрузка сделок…<div class="m-slow-hint" id="slowHint" hidden>Сервер Google просыпается — первый запуск бывает до 10–20 секунд.</div></div>';
      slowHint = setTimeout(function () { const h = document.getElementById('slowHint'); if (h) h.hidden = false; }, 4000);
    }
    setBusy_(true);
    api('getBoard').then(applyFreshBoard_).catch(function (err) {
      console.error('loadBoard:', err);
      // доска из прошлого запуска уже на экране — не прячем её за ошибкой
      if (cached) setOffline_(true); else showLoadError(err);
    }).then(function () {
      clearTimeout(slowHint);
      setBusy_(false);
    });
  }

  // ---------- доска (mobile-v2.13): группы → этапы кнопками → список ----------
  // Главный экран — карточки групп (Продажи/Разработка/Производство) со
  // сводкой по этапам. Нажали на группу — сверху кнопки её этапов, под ними
  // компактный вертикальный список сделок выбранного этапа; свайп влево/вправо
  // по списку — соседний этап. Поиск — общий список по всем этапам.
  let boardGroup = null;        // открытая группа (имя) или null — экран групп
  const boardStageSel = {};     // выбранный этап по группам
  // Архивные этапы (COLLAPSIBLE_STAGES: Успешные/Отказы/Закрыть/Реализовано)
  // по умолчанию свёрнуты в одну кнопку «Архив · N» — как на десктопе.
  const boardArchiveOpen = {};  // группа → раскрыт ли архив
  function visibleStages_(g) {
    return boardArchiveOpen[g.name] ? g.stages.slice()
      : g.stages.filter(function (s) { return COLLAPSIBLE_STAGES.indexOf(s) === -1 || s === boardStageSel[g.name]; });
  }
  function toggleArchive_() {
    const g = groupByName_(boardGroup);
    if (!g) return;
    boardArchiveOpen[g.name] = !boardArchiveOpen[g.name];
    // свернули архив, стоя на архивном этапе — вернуться на рабочий
    if (!boardArchiveOpen[g.name] && COLLAPSIBLE_STAGES.indexOf(boardStageSel[g.name]) !== -1) boardStageSel[g.name] = defaultStage_(g);
    renderBoard();
    centerStageChip_();
  }

  // "дубль" (ДопЭтапы, v3.7.2 десктоп) — та же сделка (тот же id) считается
  // относящейся к этапу, если это её основной "Этап" ИЛИ один из extraStages.
  function dealAtStage_(d, stage) {
    return d.stage === stage || (d.extraStages || []).indexOf(stage) !== -1;
  }
  // "Успешные" (десктоп v3.7.85) — не основной этап, а отметка wonAt поверх
  // реального этапа: витрина строится по wonAt.
  function stageDeals_(stage) {
    return stage === 'Успешные'
      ? ALL_DEALS.filter(function (d) { return d.wonAt; })
      : ALL_DEALS.filter(function (d) { return dealAtStage_(d, stage); });
  }
  function groupByName_(name) {
    return STAGE_GROUPS.find(function (g) { return g.name === name; });
  }
  function sumOf_(deals) { return deals.reduce(function (s, d) { return s + (Number(d.sum) || 0); }, 0); }
  // Этап по умолчанию — первый «рабочий» (не архивный) с сделками.
  function defaultStage_(g) {
    const work = g.stages.filter(function (s) { return COLLAPSIBLE_STAGES.indexOf(s) === -1; });
    return work.find(function (s) { return stageDeals_(s).length; }) || work[0] || g.stages[0];
  }
  function stageColorStyle_(g, stage) {
    const c = (g.stageColors && g.stageColors[stage]) || g;
    return '--gc:' + c.color + '; --gc-light:' + themeTint_(c) + ';';
  }

  // Строка сделки в списке. stage — этап списка (для пометки дубля),
  // showStage — подписать этап (в результатах поиска).
  function dealRowHtml_(d, stage, showStage, withRemainder) {
    // Дубли (ДопЭтапы) — как на десктопе (v3.7.3/74/75): главная карточка
    // жёлтая с плашкой «главный», её «призраки» на доп.этапах — серые,
    // с плашкой «дубль» и подписью, где главная.
    const isWon = stage === 'Успешные';
    const isGhost = !isWon && d.dup && stage && d.stage !== stage;
    const isMain = !isWon && d.dup && !isGhost;
    const tag = isMain ? '<span class="m-drow-tag main">главный</span>'
      : (isGhost ? '<span class="m-drow-tag ghost">дубль</span>' : '');
    const dupInfo = isMain ? 'также: ' + (d.extraStages || []).join(', ')
      : (isGhost ? 'главный этап: ' + d.stage : '');
    const meta = [
      dupInfo,
      showStage && !isGhost ? d.stage : '',
      d.contractNo,
      d.payment,
      d.itemsCount ? d.itemsCount + ' ' + plural_(d.itemsCount, 'изделие', 'изделия', 'изделий') : '',
      withRemainder && Number(d.remainder) > 0 ? 'остаток ' + fmtMoney(d.remainder) : ''
    ].filter(Boolean).join(' · ');
    return '<div class="m-drow' + (isMain ? ' dup-main' : '') + (isGhost ? ' dup-ghost' : '') + '" onclick="openDetail(\'' + esc(d.id) + '\')">' +
      '<div class="m-drow-main"><div class="m-drow-name">' + esc(d.name) + tag + '</div>' +
      (meta ? '<div class="m-drow-meta">' + esc(meta) + '</div>' : '') + '</div>' +
      '<div class="m-drow-sum">' + fmtMoney(d.sum) + '</div></div>';
  }

  function renderBoard() {
    const totalCount = ALL_DEALS.length;
    document.getElementById('summaryBar').textContent = totalCount + ' ' + plural_(totalCount, 'сделка', 'сделки', 'сделок') + ' · ' + fmtMoney(sumOf_(ALL_DEALS));
    const body = document.getElementById('boardBody');
    const q = boardSearchQuery.trim().toLowerCase();

    // Поиск — общий список по всем этапам, с подписью этапа.
    if (q) {
      const found = ALL_DEALS.filter(function (d) {
        return String(d.name || '').toLowerCase().indexOf(q) !== -1 || String(d.contractNo || '').toLowerCase().indexOf(q) !== -1;
      });
      body.innerHTML = found.length
        ? '<div class="m-section m-dlist">' + found.map(function (d) { return dealRowHtml_(d, d.stage, true, true); }).join('') + '</div>'
        : '<div class="state-msg">Ничего не найдено</div>';
      return;
    }

    const g = boardGroup && groupByName_(boardGroup);
    if (!g) {
      boardGroup = null;
      // Экран групп. Сводка плашки — только по «своим» этапам группы
      // (excludedFromGroupSum — как на десктопе v3.7.90).
      body.innerHTML = STAGE_GROUPS.map(function (gr) {
        const counted = gr.excludedFromGroupSum ? gr.stages.filter(function (s) { return gr.excludedFromGroupSum.indexOf(s) === -1; }) : gr.stages;
        const groupDeals = ALL_DEALS.filter(function (d) { return counted.some(function (s) { return dealAtStage_(d, s); }); });
        let meta = groupDeals.length + ' ' + plural_(groupDeals.length, 'сделка', 'сделки', 'сделок') + ' · ' + fmtMoneyShort(sumOf_(groupDeals));
        if (GROUPS_WITH_REMAINDER.indexOf(gr.name) !== -1) {
          meta += ' · остаток ' + fmtMoney(groupDeals.reduce(function (s, d) { return s + (Number(d.remainder) || 0); }, 0));
        }
        const archN = gr.stages.filter(function (s) { return COLLAPSIBLE_STAGES.indexOf(s) !== -1; })
          .reduce(function (n, s) { return n + stageDeals_(s).length; }, 0);
        const stagesLine = gr.stages.filter(function (s) { return COLLAPSIBLE_STAGES.indexOf(s) === -1; })
          .map(function (s) { const n = stageDeals_(s).length; return n ? s + ' ' + n : ''; })
          .concat(archN ? ['архив ' + archN] : []).filter(Boolean).join(' · ');
        return '<div class="m-group" style="--gc:' + gr.color + '; --gc-light:' + themeTint_(gr) + ';">' +
          '<div class="m-group-strip" onclick="openGroup_(\'' + esc(gr.name) + '\')">' +
          '<div class="g-top"><div class="title">' + esc(gr.name) + '</div><div class="chev">›</div></div>' +
          '<div class="g-meta">' + esc(meta) + '</div>' +
          (stagesLine ? '<div class="g-meta m-g-stages">' + esc(stagesLine) + '</div>' : '') +
          '</div></div>';
      }).join('') || '<div class="state-msg">Сделок пока нет</div>';
      return;
    }

    // Группа открыта: кнопки этапов + список выбранного этапа.
    if (g.stages.indexOf(boardStageSel[g.name]) === -1) boardStageSel[g.name] = defaultStage_(g);
    const sel = boardStageSel[g.name];
    const archStages = g.stages.filter(function (s) { return COLLAPSIBLE_STAGES.indexOf(s) !== -1; });
    const visible = visibleStages_(g);
    const chips = visible.map(function (s) {
      const deals = stageDeals_(s);
      return '<button type="button" class="m-dstage' + (s === sel ? ' on' : '') + (deals.length ? '' : ' empty') + (COLLAPSIBLE_STAGES.indexOf(s) !== -1 ? ' arch' : '') + '" style="' + stageColorStyle_(g, s) + '" onclick="selectStage_(' + g.stages.indexOf(s) + ')">' +
        '<span class="ds-name">' + esc(s) + ' · ' + deals.length + '</span><span class="ds-sum">' + (deals.length ? esc(fmtMoneyShort(sumOf_(deals))) : '—') + '</span></button>';
    }).join('') + (archStages.length
      ? '<button type="button" class="m-dstage m-arch-toggle" onclick="toggleArchive_()">' +
        '<span class="ds-name">' + (boardArchiveOpen[g.name] ? 'Свернуть ‹' : 'Архив · ' + archStages.reduce(function (n, s) { return n + stageDeals_(s).length; }, 0) + ' ›') + '</span>' +
        '<span class="ds-sum">' + esc(archStages.join(', ')) + '</span></button>'
      : '');
    const deals = stageDeals_(sel);
    const withRem = GROUPS_WITH_REMAINDER.indexOf(g.name) !== -1;
    body.innerHTML =
      '<div class="m-gview" style="--gc:' + g.color + ';">' +
      '<div class="m-gview-head"><button type="button" class="m-gback" onclick="closeGroup_()">' +
      '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>Все группы</button>' +
      '<span class="m-gview-title">' + esc(g.name) + '</span></div>' +
      '<div class="m-dstages" id="boardStages">' + chips + '</div>' +
      '<div class="m-gview-list" id="boardStageList">' +
      (deals.length
        ? '<div class="m-section m-dlist">' + deals.map(function (d) { return dealRowHtml_(d, sel, false, withRem); }).join('') + '</div>'
        : '<div class="state-msg">Нет сделок на этапе «' + esc(sel) + '»</div>') +
      '</div></div>';
  }
  // Выбранную кнопку этапа — в середину ленты (только по горизонтали:
  // фоновое обновление доски не должно дёргать страницу).
  function centerStageChip_() {
    const row = document.getElementById('boardStages');
    const on = row && row.querySelector('.m-dstage.on');
    if (on) row.scrollLeft = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
  }

  function openGroup_(name) {
    boardGroup = name;
    navPush_({});
    renderBoard();
    centerStageChip_();
    window.scrollTo(0, 0);
  }
  // fromPopstate — пришло из кнопки «назад», history.back() не звать.
  function closeGroup_(fromPopstate) {
    if (!boardGroup) return;
    const top = history.state;
    boardGroup = null;
    if (!IS_APPS_SCRIPT && !fromPopstate) {
      // сверху истории — эта же группа: шаг назад; иначе — новый экран «группы»
      if (top && top.dmNav && top.group && !top.dmDetail) { try { history.back(); } catch (e) { console.error(e); } }
      else navPush_({});
    }
    renderBoard();
    window.scrollTo(0, 0);
  }
  function selectStage_(i, dir) {
    const g = groupByName_(boardGroup);
    if (!g || !g.stages[i] || g.stages[i] === boardStageSel[g.name]) return;
    boardStageSel[g.name] = g.stages[i];
    renderBoard();
    centerStageChip_();
    const list = document.getElementById('boardStageList');
    if (list && dir) list.classList.add(dir > 0 ? 'm-slide-next' : 'm-slide-prev');
  }
  // Свайп влево/вправо по списку — следующий/предыдущий этап.
  function stepStage_(dir) {
    const g = groupByName_(boardGroup);
    if (!g) return;
    // свайп ходит только по видимым этапам (свёрнутый архив пропускается)
    const vis = visibleStages_(g);
    const j = vis.indexOf(boardStageSel[g.name]) + dir;
    if (j >= 0 && j < vis.length) selectStage_(g.stages.indexOf(vis[j]), dir);
  }
  (function initStageSwipe_() {
    const el = document.getElementById('boardBody');
    let sx = null, sy = null;
    el.addEventListener('touchstart', function (e) {
      sx = null;
      if (!boardGroup || boardSearchQuery.trim() || !e.target.closest('#boardStageList')) return;
      if (e.touches[0].clientX <= EDGE_SWIPE_PX) return; // край — жест «назад»
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) stepStage_(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  function onBoardSearch(value) {
    boardSearchQuery = value || '';
    renderBoard();
  }

  // ---------- разделы карточки сделки (mobile-v2.16) ----------
  // Виден один раздел; «Файлы» и «Сделки клиента» — только если они есть у
  // сделки (их секции прячет renderDetail через hidden). Свайп — соседний.
  const DETAIL_SECS = ['main', 'contacts', 'items', 'purchase', 'finance', 'clients', 'files'];
  let detailSec = 'main';
  function detailSecAvailable_(key) {
    const el = document.querySelector('#detailSections .m-dsec[data-sec="' + key + '"]');
    return !!el && !el.hidden;
  }
  function showDetailTab_(key, dir) {
    if (!detailSecAvailable_(key)) key = 'main';
    detailSec = key;
    document.querySelectorAll('#detailSections .m-dsec').forEach(function (el) { el.classList.toggle('m-dsec-off', el.dataset.sec !== key); });
    document.querySelectorAll('#detailTabs .m-dtab').forEach(function (b) {
      b.hidden = !detailSecAvailable_(b.dataset.sec);
      b.classList.toggle('on', b.dataset.sec === key);
    });
    const on = document.querySelector('#detailTabs .m-dtab.on');
    const row = document.getElementById('detailTabs');
    if (on && row) row.scrollLeft = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
    const secs = document.getElementById('detailSections');
    secs.classList.remove('m-slide-next', 'm-slide-prev');
    if (dir) { void secs.offsetWidth; secs.classList.add(dir > 0 ? 'm-slide-next' : 'm-slide-prev'); }
  }
  (function initDetailSwipe_() {
    const el = document.getElementById('detailSections');
    let sx = null, sy = null;
    el.addEventListener('touchstart', function (e) {
      sx = e.touches[0].clientX <= EDGE_SWIPE_PX ? null : e.touches[0].clientX; // край — жест «назад»
      sy = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', function (e) {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      sx = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      const avail = DETAIL_SECS.filter(detailSecAvailable_);
      const j = avail.indexOf(detailSec) + (dx < 0 ? 1 : -1);
      if (j >= 0 && j < avail.length) showDetailTab_(avail[j], dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  function openDetail(dealId) {
    detailOpen = true;
    VIEW_IDS.forEach(function (id) { document.getElementById(id).hidden = true; });
    document.getElementById('detailView').hidden = false;
    document.getElementById('detailTitle').textContent = 'Загрузка…';
    document.getElementById('detailMain').innerHTML = '';
    document.getElementById('detailFinance').innerHTML = '';
    document.getElementById('detailClientDealsSection').hidden = true;
    document.getElementById('detailFilesSection').hidden = true;
    showDetailTab_('main');
    document.getElementById('detailClientDeals').innerHTML = '';
    document.getElementById('detailContacts').innerHTML = '';
    document.getElementById('detailItems').innerHTML = '';
    document.getElementById('detailPurchase').innerHTML = '';
    window.scrollTo(0, 0);

    // Карточка из памяти телефона — сразу; свежая с сервера — следом.
    const key = String(dealId);
    currentDetailId = key;
    const cached = detailsCache_().byId[key];
    if (cached) renderDetail(cached);

    // PWA: кнопка «назад» телефона закрывает карточку, а не всё приложение.
    // В Apps Script history не трогаем — страница сидит в iframe песочницы.
    navPush_({ dmDetail: String(dealId) });

    setBusy_(true);
    api('getDealDetail', { id: dealId }).then(function (data) {
      if (data) { detailsCache_().byId[key] = data; saveDetailsCache_(); }
      if (detailOpen && currentDetailId === key) renderDetail(data);
    }).catch(function (err) {
      console.error('openDetail:', err);
      if (cached) { setOffline_(true); return; } // на экране сохранённая карточка — её и оставляем
      if (!detailOpen || currentDetailId !== key) return;
      document.getElementById('detailTitle').textContent = 'Ошибка загрузки';
      document.getElementById('detailMain').innerHTML = '<div class="state-msg">' + esc(err && err.message ? err.message : err) + '</div>';
    }).then(function () {
      setBusy_(false);
    });
  }

  // ---------- карточки сделок в памяти телефона (mobile-v2.5) ----------
  // После загрузки доски все карточки тихо подтягиваются ОДНИМ запросом
  // (getAllDealDetails: сервер читает каждый лист один раз) не чаще раза в
  // DETAILS_PREFETCH_EVERY_MS — открытие сделки потом мгновенное. Открытая
  // карточка всё равно перезапрашивается и обновляется на экране.
  const DETAILS_LS = 'dmcrm_m_details_cache';
  const DETAILS_PREFETCH_EVERY_MS = 3 * 60 * 1000;
  let detailsCache = null; // { t: время полной подгрузки, byId: {dealId: карточка} }
  let currentDetailId = null;
  let prefetchBusy = false;
  function detailsCache_() {
    if (!detailsCache) {
      try { detailsCache = JSON.parse(localStorage.getItem(DETAILS_LS) || 'null'); } catch (e) { console.error(e); }
      if (!detailsCache || !detailsCache.byId || typeof detailsCache.byId !== 'object') detailsCache = { t: 0, byId: {} };
    }
    return detailsCache;
  }
  function saveDetailsCache_() {
    try { localStorage.setItem(DETAILS_LS, JSON.stringify(detailsCache_())); } catch (e) { console.error('saveDetailsCache_:', e); }
  }
  function prefetchDetails_() {
    if (prefetchBusy) return;
    if (!IS_APPS_SCRIPT && !getApiUrl_()) return;
    if (Date.now() - detailsCache_().t < DETAILS_PREFETCH_EVERY_MS) return;
    prefetchBusy = true;
    api('getAllDealDetails').then(function (byId) {
      detailsCache = { t: Date.now(), byId: byId || {} };
      saveDetailsCache_();
    }).catch(function (err) {
      console.error('prefetchDetails_:', err);
    }).then(function () {
      prefetchBusy = false;
    });
  }

  // fromPopstate — закрытие уже пришло из истории (кнопка «назад»),
  // повторно history.back() не звать.
  function closeDetail(fromPopstate) {
    if (!detailOpen) return;
    detailOpen = false;
    document.getElementById('detailView').hidden = true;
    document.getElementById(VIEW_BY_TAB[currentTab]).hidden = false;
    if (!IS_APPS_SCRIPT && !fromPopstate && history.state && history.state.dmDetail) {
      try { history.back(); } catch (e) { console.error(e); }
    }
  }

  function renderDetail(data) {
    if (!data) {
      document.getElementById('detailTitle').textContent = 'Сделка не найдена';
      return;
    }
    const d = data.deal;
    document.getElementById('detailTitle').textContent = d.name;
    setTimeout(function () { showDetailTab_(detailSec); }, 0); // вкладки «Файлы»/«Клиент» — по наличию

    const group = groupForStage(d.stage);
    document.getElementById('detailStageBlock').style.setProperty('--stage-color', group ? group.color : '#2e5b4f');
    document.getElementById('detailStageName').textContent = (d.stage || '').toUpperCase();
    document.getElementById('detailStageFill').style.width = stageProgressPct(d.stage) + '%';
    // дубли сделки (ДопЭтапы) — берём с доски, в карточке сервер их не отдаёт
    const onBoard = ALL_DEALS.find(function (x) { return String(x.id) === String(d.id); });
    const dupsEl = document.getElementById('detailDups');
    const extra = onBoard && onBoard.extraStages && onBoard.extraStages.length ? onBoard.extraStages : [];
    dupsEl.hidden = !extra.length;
    dupsEl.textContent = extra.length ? 'Также на этапах: ' + extra.join(', ') : '';

    const mainRows = [
      ['Договор №', d.contractNo],
      ['Дата подписания', d.signDate],
      ['Сумма', fmtMoney(d.sum)],
      ['Оплата', d.payment],
      ['Аванс', fmtMoney(d.prepay)],
      ['Остаток', fmtMoney(d.remainder)],
      ['Бонус дизайнеру отдали', fmtMoney(d.bonus)],
      ['Адрес', d.address]
    ];
    // "Клиент" — плательщик (сущность со своим id, лист "Клиенты"), первой
    // строкой, как в десктопной панели (clientFieldHtml).
    const clientRowHtml = d.client
      ? '<div class="m-row"><label>Клиент</label><div class="val" style="color:var(--link); font-weight:600;">' +
        esc(d.client.name || '—') + ' <span style="color:var(--muted); font-weight:400;">#' + esc(d.client.id) + '</span></div></div>'
      : '<div class="m-row"><label>Клиент</label><div class="val">—</div></div>';
    document.getElementById('detailMain').innerHTML = clientRowHtml + mainRows.map(function (row) {
      return '<div class="m-row"><label>' + esc(row[0]) + '</label><div class="val">' + esc(row[1] || '—') + '</div></div>';
    }).join('');

    // Файлы — ссылки на Яндекс.Диск (десктоп v3.7.82). Только чтение: кнопка
    // открывает ссылку в новой вкладке, поля ввода нет — мобильная версия
    // ничего не пишет в таблицу (см. комментарий у getDealDetail в Code.gs).
    const filesSection = document.getElementById('detailFilesSection');
    const fileLinks = [];
    if (d.dealLink) fileLinks.push(['Ссылка на сделку', d.dealLink]);
    if (d.calcLink) fileLinks.push(['Ссылка на расчёт', d.calcLink]);
    if (fileLinks.length) {
      filesSection.hidden = false;
      document.getElementById('detailFiles').innerHTML = fileLinks.map(function (row) {
        return '<a class="m-file-btn" href="' + esc(row[1]) + '" target="_blank" rel="noopener"><span>' + esc(row[0]) + '</span><span>↗</span></a>';
      }).join('');
    } else {
      filesSection.hidden = true;
    }

    // Финансы — список датированных платежей (Аванс/Остаток в "Основном" —
    // просто зеркальный вывод той же суммы, см. getDealDetail).
    const payments = data.payments || [];
    const finRows = payments.map(function (p) {
      return '<div class="m-fin-row"><div class="fin-date">' + esc(p.date || '—') + '</div><div class="fin-sum">' + fmtMoney(p.sum) + '</div></div>';
    }).join('');
    document.getElementById('detailFinance').innerHTML =
      (finRows || '<div class="state-msg">Платежей пока нет</div>') +
      '<div class="m-row"><label>Бонус дизайнеру</label><div class="val">' + fmtMoney(d.bonus) + '</div></div>' +
      '<div class="m-row m-fin-total"><label>Остаток по договору</label><div class="val">' + fmtMoney(d.remainder) + '</div></div>';

    // Сделки клиента в работе — только если сделка привязана к клиенту.
    const clientDeals = data.clientDeals || [];
    const cdSection = document.getElementById('detailClientDealsSection');
    if (clientDeals.length) {
      cdSection.hidden = false;
      document.getElementById('detailClientDeals').innerHTML = clientDeals.map(function (cd) {
        const isCurrent = String(cd.id) === String(d.id);
        return '<div class="m-cd-row' + (isCurrent ? ' current' : '') + '">' +
          '<div class="m-cd-top"><span class="cd-name">' + esc(cd.name) + '</span><span class="cd-stage">' + esc(cd.stage) + '</span></div>' +
          '<div class="m-cd-nums"><span>Сумма ' + fmtMoney(cd.sum) + '</span><span>Остаток ' + fmtMoney(cd.remainder) + '</span></div>' +
          '</div>';
      }).join('');
    } else {
      cdSection.hidden = true;
    }

    const contacts = data.contacts || [];
    document.getElementById('detailContacts').innerHTML = contacts.length
      ? contacts.map(function (c) {
          return '<div class="m-contact">' +
            '<div class="m-contact-top"><span class="m-role ' + roleClass(c.role) + '">' + esc(c.role) + '</span></div>' +
            '<div class="m-row"><label>Имя</label><div class="val">' + esc(c.name || '—') + '</div></div>' +
            '<div class="m-row"><label>Телефон</label><div class="val">' + esc(c.phone || '—') + '</div></div>' +
            '<div class="m-row"><label>Email</label><div class="val">' + esc(c.email || '—') + '</div></div>' +
            '</div>';
        }).join('')
      : '<div class="state-msg">Контакты не добавлены</div>';

    const items = data.items || [];
    document.getElementById('detailItems').innerHTML = items.length
      ? items.map(function (item) {
          const chk = ITEM_STAGES.map(function (s) {
            return '<div class="m-chk' + stageStateClass(item[s.key]) + '">' + esc(s.label) + '</div>';
          }).join('');
          return '<div class="m-item"><div class="m-item-name">' + esc(item.name) + '</div><div class="m-chk-grid">' + chk + '</div></div>';
        }).join('')
      : '<div class="state-msg">Изделия не добавлены</div>';

    // Закупка — единый список позиций (категория на строке, 4-ступенчатый
    // статус, датированные платежи по позиции), сводка сверху.
    const purchase = data.purchase || [];
    if (!purchase.length) {
      document.getElementById('detailPurchase').innerHTML = '<div class="state-msg">Позиций закупки нет</div>';
    } else {
      const totalAmount = purchase.reduce(function (s, p) { return s + (Number(p.amount) || 0); }, 0);
      const totalPaid = purchase.reduce(function (s, p) { return s + (Number(p.paid) || 0); }, 0);
      const totalRemainder = totalAmount - totalPaid;
      const totalsHtml = '<div class="m-purchase-totals">' +
        '<div class="cell"><div class="lbl">Заказано</div><div class="num">' + fmtMoney(totalAmount) + '</div></div>' +
        '<div class="cell"><div class="lbl">Оплачено</div><div class="num">' + fmtMoney(totalPaid) + '</div></div>' +
        '<div class="cell remainder"><div class="lbl">Остаток</div><div class="num">' + fmtMoney(totalRemainder) + '</div></div>' +
        '</div>';

      const itemsHtml = purchase.map(function (p) {
        const catInfo = PURCHASE_CATEGORIES.find(function (c) { return c.key === p.category; });
        const statusesHtml = PURCHASE_STAGES.map(function (s) {
          return '<div class="m-pstatus' + (s.key === p.status ? ' active' : '') + '">' + esc(s.label) + '</div>';
        }).join('');
        const payRows = (p.payments || []).map(function (pay) {
          return '<div class="m-fin-row"><div class="fin-date">' + esc(pay.date || '—') + '</div><div class="fin-sum">' + fmtMoney(pay.sum) + '</div></div>';
        }).join('');
        const paySub = payRows
          ? '<div class="m-pay-sub">' + payRows + '<div class="m-fin-remainder"><span>Остаток по позиции</span><span>' + fmtMoney(p.remainder) + '</span></div></div>'
          : '';
        return '<div class="m-item">' +
          '<span class="m-cat ' + esc(p.category) + '">' + esc(catInfo ? catInfo.label : p.category) + '</span>' +
          '<div class="m-item-name">' + esc(p.name || '—') + '</div>' +
          // v2.20: поставщик и № счёта — как во вкладке «Закупка»
          ((p.supplierName || p.invoiceNo) ? '<div class="m-reg-meta m-item-supplier">' + esc([p.supplierName, p.invoiceNo ? 'счёт № ' + p.invoiceNo : ''].filter(Boolean).join(' · ')) + '</div>' : '') +
          '<div class="m-pstatus-grid">' + statusesHtml + '</div>' +
          '<div class="m-row"><label>Сумма</label><div class="val">' + fmtMoney(p.amount) + '</div></div>' +
          paySub +
          '</div>';
      }).join('');

      document.getElementById('detailPurchase').innerHTML = totalsHtml + itemsHtml;
    }
  }

  // Состояние доски (открытая группа, выбранный этап) живёт в переменных
  // (boardGroup/boardStageSel), фоновому обновлению достаточно сохранить скролл.
  function captureBoardState() {
    return { scrollY: window.scrollY };
  }
  function restoreBoardState(state) {
    if (state) window.scrollTo(0, state.scrollY);
  }

  // showBusy — показать полоску загрузки (возврат в приложение); плановое
  // обновление раз в 20с идёт тихо, чтобы полоска не мигала постоянно.
  function backgroundRefresh(showBusy) {
    if (detailOpen) return;
    if (!IS_APPS_SCRIPT && !getApiUrl_()) return;
    if (!document.querySelector('.m-group')) return; // первая загрузка ещё идёт или упала — это loadBoard
    if (showBusy) setBusy_(true);
    api('getBoard').then(function (deals) {
      if (detailOpen) { saveBoardCache_(deals); setOffline_(false); return; }
      applyFreshBoard_(deals);
    }).catch(function (err) {
      // фоновое обновление: доску не ломаем, только помечаем «нет связи»
      console.error('backgroundRefresh:', err);
      setOffline_(true);
    }).then(function () {
      if (showBusy) setBusy_(false);
    });
  }

  updateThemeBtn_();
  initMarquee();
  loadBoard();
  // счётчики на вкладках «Закупка»/«Бонусы» — сразу из сохранённого, потом тихо с сервера
  renderTabBadges_();
  if (IS_APPS_SCRIPT || getApiUrl_()) {
    loadRegistry_('purchase', false);
    if (!GATE_ON || gateToken_()) GATED_KINDS.forEach(function (k) { loadRegistry_(k, false); }); // с паролем — счётчики только после него
  }
  setInterval(function () { backgroundRefresh(false); }, REFRESH_MS);

  if (!IS_APPS_SCRIPT) {
    try { history.replaceState(navSnapshot_(), ''); } catch (e) { console.error(e); }
    window.addEventListener('popstate', onNavPop_);
    // iPhone (приложение на экране «Домой»): своего «назад» нет, а системный
    // свайп от края в таком режиме не работает — делаем свой: от левого края
    // (24px) вправо на 70px+ — шаг назад. На Android — системный жест/кнопка.
    if (window.navigator.standalone === true) {
      let ex = null, ey = 0;
      document.addEventListener('touchstart', function (e) {
        const t = e.touches[0];
        ex = t.clientX <= EDGE_SWIPE_PX ? t.clientX : null; ey = t.clientY;
      }, { passive: true });
      document.addEventListener('touchend', function (e) {
        if (ex === null) return;
        const t = e.changedTouches[0], dx = t.clientX - ex, dy = Math.abs(t.clientY - ey);
        ex = null;
        if (dx > 70 && dy < dx * 0.6 && !isNavRoot_()) { try { history.back(); } catch (err) { console.error(err); } }
      }, { passive: true });
    }
    // Вернулись в приложение из фона — сразу освежить доску, не ждать 20с.
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') backgroundRefresh(true);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) { console.error('SW register failed:', err); });
      });
    }
  }
</script>
</body>
</html>
