<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DM_CRM Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#eef0f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DM_CRM">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --accent: #2e5b4f;
    --accent-light: #40c4a0;
    --bg: #f5f6f7;
    --card: #ffffff;
    --panel-bg: #ffffff;
    --border: #e0e0e0;
    --text: #2a2a2a;
    --muted: #888;
    --link: #1a5fb4;
    --badge-bg: #eaf3f0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: var(--text);
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- шапка ---------- */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #topbar h1 { display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 20px; margin: 0; color: var(--accent); font-weight: 700; letter-spacing: -.2px; }
  /* v2.11: по центру строки названия, высота ~ высоте заглавных букв лого
     (16px при 16px-названии), отступ 8px (gap у h1), шрифт интерфейса */
  .version-badge {
    display: inline-flex; align-items: center; height: 16px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    background: var(--badge-bg);
    border: 1px solid var(--accent-light);
    border-radius: 5px;
    padding: 0 6px;
  }
  .device-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 8.5px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
    padding: 4px 8px 4px 6px; border-radius: 20px;
    background: linear-gradient(135deg, #1a8fa0, #3f6fd1);
    color: #fff; flex-shrink: 0;
  }
  .device-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); flex-shrink: 0; }
  #marquee-mobile {
    padding: 4px 16px;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
  }
  .summary-bar { font-size: 13px; color: var(--muted); }

  #boardView, #detailView, #purchaseView, #bonusView { flex: 1; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  [hidden] { display: none !important; }

  .state-msg { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---------- доска: группы-кнопки ---------- */
  .m-group { margin: 10px 12px 0; }
  .m-group-strip {
    padding: 10px 14px;
    background: var(--gc);
    color: #fff;
    display: flex;
    flex-direction: column;
    gap: 3px;
    cursor: pointer;
    user-select: none;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  .m-group-strip .g-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .m-group-strip .title { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
  .m-group-strip .g-meta { font-size: 11px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-group-strip .chev { font-size: 12px; opacity: .85; flex-shrink: 0; }
  .m-group-body {
    margin-top: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .m-stage-header {
    padding: 8px 14px;
    background: var(--gc-light);
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text);
    border-top: 1px solid rgba(0,0,0,.05);
  }
  .m-group-body > .m-stage-wrap:first-child > .m-stage-header { border-top: none; }
  .m-stage-header .meta { font-weight: 400; text-transform: none; color: var(--muted); }
  .m-empty { padding: 10px 14px 14px; background: var(--gc-light); font-size: 11px; font-style: italic; color: var(--muted); }

  .m-cards {
    padding: 8px 14px 12px;
    background: var(--gc-light);
    display: flex;
    flex-direction: row;
    gap: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    scrollbar-width: none;
  }
  .m-cards::-webkit-scrollbar { display: none; }
  .m-cards .m-card { flex: 0 0 76%; scroll-snap-align: start; min-width: 0; }

  .m-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .m-card .name { font-size: 13px; font-weight: 600; color: var(--link); margin-bottom: 3px; }
  .m-card .contract-no { font-size: 11px; color: var(--muted); }
  .m-card .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; }
  .m-card .sum { font-weight: 700; }
  .m-card .payment { color: var(--muted); font-size: 11px; }
  .m-card .items-summary { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--muted); }
  .m-card-dup { border-color: #e0a020; }
  .m-card-won { border-color: #2e9147; }
  .m-stage-header.collapsible { cursor: pointer; }
  .m-stage-header .chev { font-size: 10px; opacity: .8; margin-left: 4px; }
  .m-card .dup-badge { display: inline-block; margin-left: 6px; font-size: 9px; font-weight: 700; text-transform: uppercase; color: #b06a00; background: #fff3e0; border-radius: 6px; padding: 1px 5px; vertical-align: middle; }

  /* ---------- карточка сделки ---------- */
  .m-panel-header { background: #1c2a33; color: #fff; padding: 12px 14px 14px; }
  .m-panel-top { display: flex; align-items: flex-start; gap: 10px; }
  .m-back { color: rgba(255,255,255,.7); font-size: 18px; flex-shrink: 0; cursor: pointer; padding: 0 2px; }
  .m-title { font-size: 15px; font-weight: 700; line-height: 1.3; flex: 1; }
  .m-stage-block { background: var(--stage-color, var(--accent)); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .m-stage-name { font-size: 12px; font-weight: 700; letter-spacing: .3px; margin-bottom: 6px; color: #fff; }
  .m-stage-track { height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; overflow: hidden; }
  .m-stage-fill { height: 100%; background: #fff; border-radius: 2px; }

  .m-section {
    margin: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(20,30,40,.07);
  }
  .m-section-title {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px 10px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700;
    cursor: pointer; user-select: none;
  }
  .m-section-title .chev { font-size: 11px; color: var(--muted); }
  .m-section-body { padding: 0 14px 14px; }
  .m-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .m-row:last-child { border-bottom: none; }
  .m-row label { color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .m-row .val { color: var(--text); text-align: right; font-weight: 500; }

  /* Блок "Файлы" (десктоп v3.7.82) — только чтение, кнопка-ссылка на
     Яндекс.Диск, без поля ввода (мобильная версия ничего не редактирует). */
  .m-file-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 12px; margin: 8px 0; border-radius: 8px;
    background: var(--card-alt, rgba(0,0,0,.04)); color: var(--link);
    font-size: 13px; font-weight: 600; text-decoration: none;
  }
  .m-file-btn:first-child { margin-top: 0; }
  .m-file-btn:last-child { margin-bottom: 0; }

  .m-contact { padding: 10px 0; border-top: 1px solid var(--border); }
  .m-contact:first-of-type { border-top: none; padding-top: 0; }
  .m-contact-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .m-role { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 2px 9px; border-radius: 10px; color: #fff; }
  .m-role.client { background: var(--accent); }
  .m-role.designer { background: #3f6fd1; }
  .m-role.builder { background: #d17a1f; }
  .m-role.other { background: var(--muted); }

  .m-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .m-item:last-child { margin-bottom: 0; }
  .m-item-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .m-item-supplier { margin: -4px 0 8px; }
  .m-chk-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .m-chk { font-size: 11px; padding: 5px 4px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); background: var(--card); text-align: center; flex: 1 1 30%; min-width: 70px; }
  /* ---------- поиск по доске ---------- */
  .m-dash { padding: 2px 12px 6px; }
  .m-dash-search {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 9px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .m-dash-search svg { flex-shrink: 0; color: var(--muted); }
  .m-dash-search input { border: none; outline: none; font-size: 12.5px; color: var(--text); background: transparent; flex: 1; min-width: 0; font-family: inherit; }
  .m-dash-search input::placeholder { color: var(--muted); }
  .m-chk.on { border-color: var(--accent-light); background: var(--badge-bg); color: var(--accent); font-weight: 600; }
  .m-chk.progress { border-color: #ffb74d; background: rgba(255, 183, 77, .18); color: #b06a00; font-weight: 600; }

  /* ---------- Финансы ---------- */
  .m-fin-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .m-fin-row .fin-date { color: var(--muted); flex: 1; }
  .m-fin-row .fin-sum { font-weight: 600; white-space: nowrap; }
  .m-fin-total { border-bottom: none !important; border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px !important; font-weight: 700; }
  .m-fin-total .val { color: var(--accent); }

  /* ---------- Сделки клиента в работе ---------- */
  .m-cd-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .m-cd-row:last-child { border-bottom: none; }
  .m-cd-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
  .m-cd-top .cd-stage { font-size: 10px; color: var(--muted); background: var(--badge-bg); border-radius: 8px; padding: 2px 8px; white-space: nowrap; }
  .m-cd-nums { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .m-cd-row.current { background: var(--badge-bg); margin: 0 -14px; padding: 8px 14px; }
  .m-cd-row.current:last-child { border-radius: 0 0 8px 8px; }

  /* ---------- Закупка ---------- */
  .m-purchase-totals { display: flex; gap: 6px; margin-bottom: 10px; }
  .m-purchase-totals .cell { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; text-align: center; }
  .m-purchase-totals .cell .lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; }
  .m-purchase-totals .cell .num { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .m-purchase-totals .cell.remainder .num { color: var(--accent); }
  .m-cat { display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 2px 8px; border-radius: 9px; color: #fff; margin-bottom: 6px; }
  .m-cat.furniture { background: #2e5b4f; }
  .m-cat.contractor { background: #b06a00; }
  .m-cat.sheet { background: #6b4fbb; }
  .m-cat.facade { background: #c2185b; }
  .m-pstatus-grid { display: flex; gap: 5px; margin: 6px 0; }
  .m-pstatus-grid .m-pstatus { flex: 1; font-size: 9.5px; padding: 4px 2px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); background: var(--card); text-align: center; }
  .m-pstatus-grid .m-pstatus.active { border-color: var(--accent-light); background: var(--badge-bg); color: var(--accent); font-weight: 700; }
  .m-pay-sub { margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 6px; }
  .m-pay-sub .m-fin-row { padding: 4px 0; font-size: 12px; }
  .m-pay-sub .m-fin-row:last-of-type { border-bottom: none; }
  .m-pay-sub .m-fin-remainder { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding-top: 4px; font-weight: 600; }

  /* ---------- PWA: экран подключения, пометка «нет связи» ---------- */
  .m-pwa-setup { margin: 16px 12px; padding: 16px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
  .m-pwa-setup-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .m-pwa-setup-hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
  .m-pwa-setup input {
    width: 100%; font-size: 14px; font-family: inherit; color: var(--text);
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-bg);
  }
  .m-pwa-setup-err { font-size: 12px; color: #c0392b; min-height: 16px; margin: 6px 0 8px; }
  .m-pwa-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    padding: 9px 16px; border-radius: 10px; border: 1px solid transparent;
    background: var(--accent); color: #fff;
  }
  .m-pwa-btn.secondary { background: transparent; color: var(--accent); border-color: var(--border); }
  html[data-theme="graphite"] .m-pwa-btn:not(.secondary) { color: #121215; }
  body.m-busy .summary-bar::after { content: ' · обновляю…'; color: var(--accent); font-weight: 600; }
  body.m-offline .summary-bar::after { content: ' · нет связи'; color: #c0392b; font-weight: 600; }
  /* бегущая полоска под шапкой, пока идёт запрос (mobile-v2.3) */
  body.m-busy #topbar::after {
    content: ''; position: absolute; left: 0; bottom: -1px; height: 2px; width: 35%;
    background: var(--accent); border-radius: 2px;
    animation: m-busy-run 1.1s ease-in-out infinite;
  }
  @keyframes m-busy-run { 0% { left: -35%; } 100% { left: 100%; } }
  #topbar { overflow: hidden; }
  .m-slow-hint { margin-top: 8px; font-size: 11.5px; opacity: .85; }

  /* ============ mobile-v2.4: современный вид — крупные заголовки экранов,
     нижняя панель вкладок, экраны «Закупка» и «Бонусы» ============ */
  .m-hero { padding: 16px 16px 8px; }
  .m-hero-title { font-size: 30px; font-weight: 800; letter-spacing: -.8px; line-height: 1.1; color: var(--text); }
  .m-hero-sub { margin-top: 4px; }

  /* нижняя панель вкладок */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; justify-content: space-around;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--panel-bg); border-top: 1px solid var(--border);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  }
  html[data-theme="glass"] #tabbar, html[data-theme="desert"] #tabbar {
    background: rgba(var(--sheen-rgb), .62); border-top-color: rgba(var(--sheen-rgb), .8);
    box-shadow: 0 -8px 24px -16px rgba(var(--shade-rgb), .35);
  }
  html[data-theme="graphite"] #tabbar { background: rgba(22, 22, 26, .82); }
  .m-tab {
    flex: 1; max-width: 120px; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 4px 0; border: none; background: none; cursor: pointer;
    color: var(--muted); font-family: inherit; font-size: 10.5px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  .m-tab svg { width: 24px; height: 24px; }
  .m-tab.on { color: var(--accent); }
  .m-tab-badge {
    position: absolute; top: 0; left: calc(50% + 6px);
    min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
    background: #e5484d; color: #fff; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center;
  }

  /* сегменты «Не оплачено / Все» */
  .m-seg { display: flex; margin: 4px 12px 8px; padding: 3px; border-radius: 12px; background: var(--badge-bg); }
  .m-seg button {
    flex: 1; border: none; background: transparent; cursor: pointer;
    padding: 7px 6px; border-radius: 9px; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted);
  }
  .m-seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
  html[data-theme="graphite"] .m-seg button.on { background: #2a2a30; }

  /* итоги наверху реестров */
  .m-kpis { display: flex; gap: 8px; margin: 4px 12px 6px; }
  .m-kpis .m-section { flex: 1; margin: 0; padding: 10px 10px 9px; min-width: 0; }
  .m-kpi-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); }
  .m-kpi-num { font-size: 14px; font-weight: 800; margin-top: 3px; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-kpi-num.accent { color: var(--accent); }
  .m-kpi-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
  .m-kpi-tap { cursor: pointer; }
  .m-kpi-tap.on { box-shadow: inset 0 0 0 2px var(--accent) !important; }
  .m-tel { color: var(--link); font-weight: 600; text-decoration: none; }

  /* строки реестров */
  .m-reg-item { padding: 12px 14px; cursor: pointer; }
  .m-reg-item:active { transform: scale(.99); }
  .m-reg-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .m-reg-name { font-size: 14px; font-weight: 700; min-width: 0; }
  .m-reg-amount { font-size: 14px; font-weight: 800; white-space: nowrap; letter-spacing: -.2px; }
  .m-reg-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .m-reg-deal { font-size: 12px; color: var(--link); margin-top: 3px; font-weight: 600; }
  .m-reg-bottom { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .m-reg-bottom .m-cat { margin-bottom: 0; }
  .m-chip { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 10px; background: var(--badge-bg); color: var(--muted); }
  .m-chip.ok { background: rgba(46, 145, 71, .14); color: #2e9147; }
  .m-chip.due { background: rgba(224, 128, 32, .16); color: #b8620a; }
  .m-chip.off { background: rgba(138, 148, 161, .16); color: var(--muted); }
  html[data-theme="graphite"] .m-chip.ok { color: #6fd08a; }
  html[data-theme="graphite"] .m-chip.due { color: #f3b26b; }
  .m-dgroup { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 16px 16px 2px; }
  .m-dgroup-name { font-size: 15px; font-weight: 800; letter-spacing: -.3px; }
  .m-dgroup-sum { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }

  /* ---------- доска (mobile-v2.13): группа → кнопки этапов → компактный список ---------- */
  .m-g-stages { margin-top: 2px; opacity: .75; }
  .m-gview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 12px 6px; }
  /* v2.15: «назад к группам» — заметная кнопка-плашка (просьба «более явная») */
  .m-gback {
    display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
    padding: 8px 14px 8px 8px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-family: inherit; font-size: 14px; font-weight: 700;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 12px -6px rgba(0, 0, 0, .18);
  }
  .m-gback svg { color: var(--accent); flex-shrink: 0; }
  .m-gback:active { transform: scale(.97); }
  .m-gview-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; color: var(--text); }
  .m-gview-title::before {
    content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--gc); margin-right: 6px; vertical-align: 1px;
  }
  .m-gview .m-dstage.on { background: var(--gc); border-color: var(--gc); color: #fff; }
  .m-gview .m-dstage.on .ds-sum { color: rgba(255, 255, 255, .85); }
  html[data-theme="graphite"] .m-gview .m-dstage.on { color: #fff; }
  html[data-theme="graphite"] .m-gview .m-dstage.on .ds-sum { color: rgba(255, 255, 255, .8); }
  .m-gview .m-dstage.empty { opacity: .55; }
  .m-arch-toggle { border-style: dashed; background: transparent; }
  .m-arch-toggle .ds-name { color: var(--muted); }
  .m-arch-toggle .ds-sum { max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
  .m-gview-list { min-height: 50vh; }
  .m-gview-list.m-slide-next { animation: m-slide-next .22s ease-out; }
  .m-gview-list.m-slide-prev { animation: m-slide-prev .22s ease-out; }
  @keyframes m-slide-next { from { opacity: .3; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes m-slide-prev { from { opacity: .3; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  .m-dlist { padding: 0; }
  .m-drow { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
  .m-drow + .m-drow { border-top: 1px solid var(--border); }
  .m-drow:active { background: var(--badge-bg); }
  .m-drow-main { flex: 1; min-width: 0; }
  .m-drow-name { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-drow-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-drow-sum { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .m-drow-tag {
    display: inline-block; margin-left: 6px; font-size: 9px; font-weight: 700; text-transform: uppercase;
    border-radius: 6px; padding: 1px 5px; vertical-align: 1px;
  }
  /* дубли: главная — жёлтая, «призраки» на доп.этапах — серые (как десктоп v3.7.74/75) */
  .m-drow-tag.main { color: #8a5a00; background: rgba(224, 160, 32, .2); }
  .m-drow-tag.ghost { color: #5b6572; background: rgba(138, 148, 161, .2); }
  .m-drow.dup-main { box-shadow: inset 3px 0 0 #e0a020; background: rgba(224, 160, 32, .07); }
  .m-drow.dup-ghost { box-shadow: inset 3px 0 0 #b0b6bd; background: rgba(138, 148, 161, .07); }
  .m-drow.dup-ghost .m-drow-name, .m-drow.dup-ghost .m-drow-sum { opacity: .6; }
  html[data-theme="graphite"] .m-drow-tag.main { color: #f3cd78; background: rgba(224, 160, 32, .16); }
  html[data-theme="graphite"] .m-drow-tag.ghost { color: #c4c4cc; background: rgba(255, 255, 255, .08); }
  .m-detail-dups { margin-top: 8px; font-size: 11.5px; color: rgba(255, 255, 255, .85); }

  /* ---------- разделы карточки сделки (mobile-v2.16) ---------- */
  .m-dtabs { display: flex; gap: 4px; overflow-x: auto; padding: 10px 10px 4px; scrollbar-width: none; }
  .m-dtabs::-webkit-scrollbar { display: none; }
  .m-dtab {
    flex: 1 0 auto; min-width: 58px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 6px 6px; border-radius: 12px; border: 1px solid transparent; background: transparent;
    color: var(--muted); font-family: inherit; font-size: 10.5px; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .m-dtab svg { width: 20px; height: 20px; }
  .m-dtab.on { color: var(--accent); background: var(--card); border-color: var(--border); box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 4px 12px -8px rgba(0, 0, 0, .2); }
  .m-dsec-off { display: none; }
  .m-dsec > .m-section-body { padding-top: 12px; }
  .m-dsec-cap { padding: 12px 14px 0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .m-dsecs { min-height: 50vh; }
  .m-dsecs.m-slide-next { animation: m-slide-next .22s ease-out; }
  .m-dsecs.m-slide-prev { animation: m-slide-prev .22s ease-out; }

  /* ---------- «Остатки» (mobile-v2.12): этапы-фильтры, полоска оплаты ---------- */
  .m-dstages { display: flex; gap: 8px; overflow-x: auto; padding: 2px 12px 8px; scrollbar-width: none; }
  .m-dstages::-webkit-scrollbar { display: none; }
  .m-dstage {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    padding: 7px 11px; border-radius: 12px; border: 1px solid var(--border); background: var(--card);
    font-family: inherit; color: var(--text); cursor: pointer;
  }
  .m-dstage .ds-name { font-size: 11px; font-weight: 700; }
  .m-dstage .ds-sum { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .m-dstage.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .m-dstage.on .ds-sum { color: rgba(255, 255, 255, .8); }
  html[data-theme="graphite"] .m-dstage.on { color: #121215; }
  html[data-theme="graphite"] .m-dstage.on .ds-sum { color: rgba(18, 18, 21, .7); }
  .m-debt-bar { position: relative; height: 6px; margin: 9px 0 4px; border-radius: 3px; background: var(--badge-bg); }
  .m-debt-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
  .m-debt-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text); opacity: .45; }

  /* ---------- кнопка темы в шапке ---------- */
  .m-topbar-right { display: flex; align-items: center; gap: 8px; }
  .m-theme-btn {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1; cursor: pointer; padding: 0;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
  }

  /* ============================================================
     Темы (mobile-v2.0) — перенос дизайна десктопа v4.0.0/v4.0.1;
     mobile-v2.1 — акценты зелёные, как на десктопе v4.0.3 (Стекло
     #1f7a63 изумрудный, Графит #5fbf9f мятный, Осенняя #4f7a45 моховый):
     🫧 Стекло / ◼️ Графит (выпуклый) / 🍁 Осенняя. Палитры 1:1 с
     десктопом. Стекло и Осенняя — одни и те же правила, разница
     только в --sheen-rgb (цвет бликов/полупрозрачных поверхностей)
     и --shade-rgb (цвет теней). Тинты групп (--gc-light) — через
     themeTint_() в скрипте, как на десктопе.
     ============================================================ */
  html[data-theme="glass"] {
    --accent: #1f7a63; --accent-light: #3fbf9b; --bg: #eef0f8;
    --card: rgba(255, 255, 255, .72); --panel-bg: rgba(250, 251, 255, .82);
    --border: rgba(30, 41, 80, .12); --text: #1e2233; --muted: #5d6478; --link: #3b5bdb;
    --badge-bg: rgba(31, 122, 99, .10);
    --sheen-rgb: 255, 255, 255; --shade-rgb: 30, 34, 80;
    color-scheme: light;
  }
  html[data-theme="desert"] {
    --accent: #4f7a45; --accent-light: #7fa86a; --bg: #f2e8d5;
    --card: rgba(255, 250, 240, .74); --panel-bg: rgba(252, 246, 236, .84);
    --border: rgba(90, 55, 20, .14); --text: #3f2e20; --muted: #86694c; --link: #8a4f1c;
    --badge-bg: rgba(79, 122, 69, .12);
    --sheen-rgb: 255, 250, 240; --shade-rgb: 90, 50, 15;
    color-scheme: light;
  }
  html[data-theme="graphite"] {
    --accent: #5fbf9f; --accent-light: #8ad6bd; --bg: #121215;
    --card: #1e1e22; --panel-bg: #19191d;
    --border: rgba(255, 255, 255, .07); --text: #ececf1; --muted: #9d9da8; --link: #a9bbff;
    --badge-bg: rgba(95, 191, 159, .14);
    color-scheme: dark;
  }

  /* --- фон --- */
  html[data-theme="glass"] body {
    background:
      radial-gradient(1200px 700px at 8% -10%, rgba(63, 191, 155, .35), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(56, 189, 248, .25), transparent 55%),
      radial-gradient(1000px 800px at 60% 110%, rgba(250, 204, 110, .18), transparent 60%),
      #eef0f8;
    background-attachment: fixed;
  }
  html[data-theme="desert"] body {
    background:
      radial-gradient(1200px 700px at 5% -10%, rgba(217, 119, 6, .28), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(190, 70, 30, .18), transparent 55%),
      radial-gradient(1000px 800px at 55% 110%, rgba(132, 140, 40, .18), transparent 60%),
      #f2e8d5;
    background-attachment: fixed;
  }
  html[data-theme="graphite"] body {
    background:
      radial-gradient(1100px 700px at 0% -10%, rgba(95, 191, 159, .10), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(90, 170, 255, .06), transparent 55%),
      #121215;
    background-attachment: fixed;
  }

  /* --- Стекло / Осенняя --- */
  html[data-theme="glass"] #topbar, html[data-theme="desert"] #topbar {
    background: rgba(var(--sheen-rgb), .5); border-bottom: 1px solid rgba(var(--sheen-rgb), .65);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  }
  html[data-theme="glass"] #marquee-mobile, html[data-theme="desert"] #marquee-mobile {
    background: rgba(var(--sheen-rgb), .35); border-bottom: 1px solid rgba(var(--sheen-rgb), .55);
  }
  html[data-theme="glass"] .m-group-strip, html[data-theme="desert"] .m-group-strip {
    background: color-mix(in srgb, var(--gc) 22%, rgba(var(--sheen-rgb), .7));

    border: 1px solid color-mix(in srgb, var(--gc) 35%, rgba(var(--sheen-rgb), .8));
    border-radius: 14px;
    -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(var(--sheen-rgb), .9), 0 8px 24px -10px rgba(var(--shade-rgb), .25);
  }
  html[data-theme="glass"] .m-group-body, html[data-theme="desert"] .m-group-body {
    background: rgba(var(--sheen-rgb), .35);
    border: 1px solid rgba(var(--sheen-rgb), .6);
    border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(var(--sheen-rgb), .7), 0 8px 24px -14px rgba(var(--shade-rgb), .2);
  }
  html[data-theme="glass"] .m-stage-header, html[data-theme="desert"] .m-stage-header {
    border-top-color: color-mix(in srgb, var(--gc) 30%, transparent);
  }
  html[data-theme="glass"] .m-card, html[data-theme="desert"] .m-card {
    background: rgba(var(--sheen-rgb), .78);
    border: 1px solid rgba(var(--sheen-rgb), .9);
    border-radius: 14px;
    box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(var(--shade-rgb), .06), 0 10px 24px -12px rgba(var(--shade-rgb), .22);
  }
  html[data-theme="glass"] .m-card-dup, html[data-theme="desert"] .m-card-dup {
    background: color-mix(in srgb, #e0a020 10%, rgba(var(--sheen-rgb), .8)); border: 1.5px solid rgba(224, 160, 32, .45);
  }
  html[data-theme="glass"] .m-card-won, html[data-theme="desert"] .m-card-won {
    background: color-mix(in srgb, #2e9147 10%, rgba(var(--sheen-rgb), .8)); border-color: rgba(46, 145, 71, .4);
  }
  html[data-theme="glass"] .m-card .dup-badge, html[data-theme="desert"] .m-card .dup-badge { color: #8a5a00; background: rgba(224, 160, 32, .18); }
  html[data-theme="glass"] .m-panel-header, html[data-theme="desert"] .m-panel-header {
    background: rgba(var(--sheen-rgb), .5); color: var(--text);
    border-bottom: 1px solid rgba(var(--sheen-rgb), .65);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  }
  html[data-theme="glass"] .m-back, html[data-theme="desert"] .m-back { color: var(--muted); }
  html[data-theme="glass"] .m-stage-block, html[data-theme="desert"] .m-stage-block {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 8px 20px -10px rgba(var(--shade-rgb), .35);
  }
  html[data-theme="glass"] .m-section, html[data-theme="desert"] .m-section,
  html[data-theme="glass"] .m-dash-search, html[data-theme="desert"] .m-dash-search {
    background: rgba(var(--sheen-rgb), .5); border: 1px solid rgba(var(--sheen-rgb), .8); border-radius: 16px;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: inset 0 1px 0 rgba(var(--sheen-rgb), .9), 0 6px 18px -10px rgba(var(--shade-rgb), .18);
  }
  html[data-theme="glass"] .m-item, html[data-theme="desert"] .m-item { border-radius: 12px; }
  html[data-theme="glass"] .m-theme-btn, html[data-theme="desert"] .m-theme-btn {
    background: rgba(var(--sheen-rgb), .55); border: 1px solid rgba(var(--sheen-rgb), .8);
    box-shadow: inset 0 1px 0 #fff, 0 4px 12px -6px rgba(var(--shade-rgb), .2);
  }
  html[data-theme="glass"] ::selection { background: rgba(31, 122, 99, .22); }
  html[data-theme="desert"] ::selection { background: rgba(79, 122, 69, .22); }

  /* --- Графит (выпуклый, как десктоп v4.0.1: световой градиент сверху
     вниз + блик по верхней кромке и тёмная кромка снизу) --- */
  html[data-theme="graphite"] #topbar {
    background: rgba(18, 18, 21, .72); border-bottom: 1px solid var(--border);
    -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
  }
  html[data-theme="graphite"] #marquee-mobile { background: rgba(18, 18, 21, .5); }
  html[data-theme="graphite"] .m-group-strip {
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 70%), color-mix(in srgb, var(--gc) 26%, #1c1c20);
    color: #f2f2f6;
    border: 1px solid color-mix(in srgb, var(--gc) 40%, transparent);
    border-radius: 12px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .3), 0 8px 20px -8px rgba(0, 0, 0, .65);
  }
  html[data-theme="graphite"] .m-group-body {
    background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, 0) 30%), rgba(255, 255, 255, .015);
    border: 1px solid rgba(255, 255, 255, .05);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07);

  html[data-theme="graphite"] .m-stage-header { border-top-color: color-mix(in srgb, var(--gc) 45%, transparent); }
  html[data-theme="graphite"] .m-card {
    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .01) 55%), #1f1f23;
    border: 1px solid rgba(255, 255, 255, .06);

    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .11), inset 0 -1px 0 rgba(0, 0, 0, .35),

  }
  html[data-theme="graphite"] .m-card-dup {
    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .01) 55%), color-mix(in srgb, #e0a020 9%, #1f1f23);
    border: 1.5px solid rgba(224, 160, 32, .45);
  }
  html[data-theme="graphite"] .m-card-won {
    background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .01) 55%), color-mix(in srgb, #2e9147 12%, #1f1f23);
    border-color: rgba(46, 145, 71, .45);
  }
  html[data-theme="graphite"] .m-card .dup-badge { color: #f3cd78; background: rgba(224, 160, 32, .16); }
  html[data-theme="graphite"] .m-panel-header {
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, 0) 60%), rgba(26, 26, 30, .9);
    border-bottom: 1px solid var(--border);
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .35);
  }
  html[data-theme="graphite"] .m-stage-block {
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 70%), color-mix(in srgb, var(--stage-color, var(--accent)) 45%, #1c1c20);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .3);
  }
  html[data-theme="graphite"] .m-section, html[data-theme="graphite"] .m-dash-search {
    background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .015) 40%), #19191d;
    border: 1px solid rgba(255, 255, 255, .06); border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .09), 0 8px 20px -12px rgba(0, 0, 0, .6);
  }
  html[data-theme="graphite"] .m-item { border-radius: 12px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
  html[data-theme="graphite"] .m-chk.progress { color: #f3cd78; }
  html[data-theme="graphite"] .m-theme-btn {
    background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));

    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 -1px 0 rgba(0, 0, 0, .3);
  }
  html[data-theme="graphite"] ::selection { background: rgba(95, 191, 159, .35); }
</style>

<body>
<div id="app">

  <div id="topbar">
